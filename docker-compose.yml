services:
  db:
    image: mysql:8.1
    container_name: adaptive-learning-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example_password
      MYSQL_DATABASE: adaptive_learning_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  app:
    build: .
    container_name: adaptive-learning-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: adaptive_learning_db
      JWT_SECRET: adaptive_learning_secret_key
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  db_data: